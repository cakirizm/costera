name: COSTERA Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://costera:costera@localhost:5432/costera?schema=public
          AUTH_SECRET: ci-build-placeholder-secret-not-used-at-runtime
          AUTH_TRUST_HOST: "true"
