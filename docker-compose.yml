services:
  postgres:
    image: postgres:17-alpine
    container_name: costera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: costera
      POSTGRES_PASSWORD: costera_dev_pw
      POSTGRES_DB: costera
    ports:
      - "5433:5432"
    volumes:
      - costera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costera -d costera"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  costera_pgdata:
