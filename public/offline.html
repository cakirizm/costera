<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COSTERA POS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #061f35;
        color: #eef3f8;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main { max-width: 440px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      p { color: #9fb3c8; line-height: 1.6; margin: 0 0 20px; }
      button {
        min-height: 48px;
        padding: 0 22px;
        border-radius: 12px;
        border: 1px solid #d7b071;
        background: #d7b071;
        color: #241a08;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantı yok / No connection</h1>
      <p>
        Bu ekran sunucuya ulaşamadı. Açık olan adisyon ekranındaki siparişler cihazda tutulur ve
        bağlantı gelince gönderilir.
        <br /><br />
        This screen could not reach the server. Orders taken on an already-open ticket are held on
        the device and sent when the connection returns.
      </p>
      <button type="button" onclick="location.reload()">Tekrar dene / Retry</button>
    </main>
  </body>
</html>
